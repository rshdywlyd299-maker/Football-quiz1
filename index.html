<script>
// ==================== بنك الأسئلة (20 سؤالاً) ====================
const allQuestions = [
  // 🟢 سهل (6)
  { q: "من فاز بكأس العالم 2022؟", answers: ["الأرجنتين", "فرنسا", "البرازيل", "ألمانيا"], correct: 0, difficulty: "easy" },
  { q: "كم عدد لاعبي فريق كرة القدم داخل الملعب؟", answers: ["10", "11", "12", "9"], correct: 1, difficulty: "easy" },
  { q: "كم دقيقة تستغرق المباراة الرسمية؟", answers: ["80", "90", "100", "120"], correct: 1, difficulty: "easy" },
  { q: "ما هي الدولة التي فازت بأول كأس عالم 1930؟", answers: ["البرازيل", "إيطاليا", "الأوروغواي", "ألمانيا"], correct: 2, difficulty: "easy" },
  { q: "أي منتخب يُلقب بـ 'الديوك'؟", answers: ["إيطاليا", "إسبانيا", "فرنسا", "البرتغال"], correct: 2, difficulty: "easy" },
  { q: "ما اسم الملعب الرئيسي لريال مدريد؟", answers: ["كامب نو", "سانتياغو برنابيو", "سان سيرو", "أليانز أرينا"], correct: 1, difficulty: "easy" },

  // 🟡 متوسط (8)
  { q: "من هو الهداف التاريخي لكأس العالم؟", answers: ["بيليه", "رونالدو", "ميروسلاف كلوزه", "ميسي"], correct: 2, difficulty: "medium" },
  { q: "أي نادٍ يُلقب بـ 'البلوغرانا'؟", answers: ["ريال مدريد", "برشلونة", "بايرن ميونخ", "مانشستر"], correct: 1, difficulty: "medium" },
  { q: "كم مرة فازت البرازيل بكأس العالم؟", answers: ["4", "5", "6", "3"], correct: 1, difficulty: "medium" },
  { q: "من هو اللاعب الملقب بـ 'البرغوث'؟", answers: ["رونالدو", "نيمار", "ميسي", "مبابي"], correct: 2, difficulty: "medium" },
  { q: "ما هي الدولة التي استضافت كأس العالم 2018؟", answers: ["قطر", "روسيا", "البرازيل", "جنوب أفريقيا"], correct: 1, difficulty: "medium" },
  { q: "من فاز بالكرة الذهبية 2023؟", answers: ["ميسي", "هالاند", "مبابي", "بنزيمة"], correct: 0, difficulty: "medium" },
  { q: "كم عدد البطاقات الحمراء التي تؤدي للطرد؟", answers: ["1", "2", "3", "4"], correct: 0, difficulty: "medium" },
  { q: "من هو أكثر لاعب تتويجاً بدوري أبطال أوروبا؟", answers: ["ميسي", "رونالدو", "باتشيكو غينتو", "راموس"], correct: 2, difficulty: "medium" },

  // 🔴 صعب (6)
  { q: "من هو الهداف التاريخي لدوري أبطال أوروبا؟", answers: ["ميسي", "رونالدو", "بنزيمة", "ليفاندوفسكي"], correct: 1, difficulty: "hard" },
  { q: "أي منتخب فاز بكأس العالم 1950 على أرضه وبين جمهوره؟", answers: ["البرازيل", "الأوروغواي", "إيطاليا", "ألمانيا"], correct: 1, difficulty: "hard" },
  { q: "من هو اللاعب الوحيد الذي فاز بكأس العالم 3 مرات كلاعب؟", answers: ["مارادونا", "بيليه", "زيدان", "رونالدو"], correct: 1, difficulty: "hard" },
  { q: "في أي عام تأسس الاتحاد الدولي لكرة القدم (فيفا)؟", answers: ["1900", "1904", "1912", "1920"], correct: 1, difficulty: "hard" },
  { q: "من هو المدرب الأكثر تتويجاً بدوري أبطال أوروبا؟", answers: ["فيرغسون", "غوارديولا", "أنشيلوتي", "مورينيو"], correct: 2, difficulty: "hard" },
  { q: "كم عدد لاعبي الاحتياط المسموح بهم في كأس العالم 2022؟", answers: ["12", "15", "23", "26"], correct: 3, difficulty: "hard" }
];

// ==================== المتغيرات العامة ====================
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let currentLevel = 'easy';
let timerInterval = null;
let timeLeft = 0;
let timePerQuestion = 15;
let soundEnabled = true;
let userAnswers = [];
let bestScores = JSON.parse(localStorage.getItem('bestScores') || '{}');

// ==================== اختصار DOM ====================
const $ = id => document.getElementById(id);
const startScreen = $('startScreen');
const quizScreen = $('quizScreen');
const resultScreen = $('resultScreen');
const answersContainer = $('answersContainer');
const nextBtn = $('nextBtn');
const timerFill = $('timerFill');
const timerText = $('timerText');
const mainContainer = $('mainContainer');

// ==================== الأصوات ====================
let audioContext;
function playSound(type) {
  if (!soundEnabled) return;
  try {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain);
    gain.connect(audioContext.destination);

    const now = audioContext.currentTime;
    if (type === 'correct') {
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
    } else if (type === 'wrong') {
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.setValueAtTime(200, now + 0.15);
    } else if (type === 'tick') {
      osc.frequency.setValueAtTime(800, now);
    }

    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } catch (e) {}
}

// ==================== الوضع الليلي ====================
function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark');
    $('themeBtn').textContent = '☀️';
  }
}

$('themeBtn').onclick = () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  $('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
};

// ==================== الصوت ====================
function initSound() {
  if (localStorage.getItem('sound') === 'off') {
    soundEnabled = false;
    $('soundBtn').textContent = '🔇';
  }
}

$('soundBtn').onclick = () => {
  soundEnabled = !soundEnabled;
  $('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
  localStorage.setItem('sound', soundEnabled ? 'on' : 'off');
};

// ==================== اختيار المستوى ====================
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.onclick = () => {
    currentLevel = btn.dataset.level;
    startQuiz();
  };
});

// ==================== بدء الاختبار ====================
function startQuiz() {
  let filtered = allQuestions.filter(q => q.difficulty === currentLevel);
  filtered = filtered.sort(() => Math.random() - 0.5);

  currentQuestions = filtered.map(q => {
    const shuffled = q.answers.map((a, i) => ({ text: a, isCorrect: i === q.correct }));
    shuffled.sort(() => Math.random() - 0.5);
    return {
      ...q,
      answers: shuffled.map(a => a.text),
      correct: shuffled.findIndex(a => a.isCorrect)
    };
  });

  if (currentLevel === 'easy') timePerQuestion = 15;
  else if (currentLevel === 'medium') timePerQuestion = 10;
  else timePerQuestion = 6;

  currentIndex = 0;
  score = 0;
  userAnswers = [];

  startScreen.classList.add('hidden');
  resultScreen.style.display = 'none';
  quizScreen.classList.remove('hidden');
  $('levelDisplay').textContent = currentLevel === 'easy' ? '🟢' : currentLevel === 'medium' ? '🟡' : '🔴';

  loadQuestion();
}

// ==================== تحميل السؤال ====================
function loadQuestion() {
  answered = false;
  nextBtn.style.display = 'none';
  const q = currentQuestions[currentIndex];

  $('questionCounter').textContent = `${currentIndex + 1}/${currentQuestions.length}`;
  $('scoreDisplay').textContent = score;
  $('progressBar').style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
  $('questionText').textContent = q.q;

  answersContainer.innerHTML = '';
  q.answers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span>${ans}</span><span class="feedback-icon"></span>`;
    btn.onclick = () => selectAnswer(i, btn);
    answersContainer.appendChild(btn);
  });

  startTimer();
}

// ==================== المؤقت ====================
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = timePerQuestion;
  updateTimerUI();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 3 && timeLeft > 0) playSound('tick');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeOut();
    }
  }, 1000);
}

function updateTimerUI() {
  const pct = (timeLeft / timePerQuestion) * 100;
  timerFill.style.width = pct + '%';
  timerText.textContent = `⏱️ ${timeLeft}`;
  timerFill.classList.remove('warning', 'danger');
  if (pct <= 33) timerFill.classList.add('danger');
  else if (pct <= 66) timerFill.classList.add('warning');
}

function timeOut() {
  if (answered) return;
  answered = true;

  userAnswers.push({
    question: currentQuestions[currentIndex].q,
    userAnswer: 'انتهى الوقت',
    correctAnswer: currentQuestions[currentIndex].answers[currentQuestions[currentIndex].correct],
    isCorrect: false
  });

  answersContainer.querySelectorAll('.answer-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === currentQuestions[currentIndex].correct) {
      b.classList.add('correct');
      b.querySelector('.feedback-icon').textContent = '✓';
    }
  });

  playSound('wrong');
  mainContainer.classList.add('shake');
  setTimeout(() => mainContainer.classList.remove('shake'), 400);

  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIndex === currentQuestions.length - 1 ? 'عرض النتيجة 🏁' : 'السؤال التالي ←';
}

// ==================== اختيار إجابة ====================
function selectAnswer(index, btn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const q = currentQuestions[currentIndex];
  const isCorrect = index === q.correct;

  answersContainer.querySelectorAll('.answer-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) {
      b.classList.add('correct');
      b.querySelector('.feedback-icon').textContent = '✓';
    } else if (i === index) {
      b.classList.add('wrong');
      b.querySelector('.feedback-icon').textContent = '✗';
    }
  });

  if (isCorrect) {
    const speedBonus = Math.floor((timeLeft / timePerQuestion) * 5);
    score += 10 + speedBonus;
    playSound('correct');
  } else {
    playSound('wrong');
    mainContainer.classList.add('shake');
    setTimeout(() => mainContainer.classList.remove('shake'), 400);
  }

  userAnswers.push({
    question: q.q,
    userAnswer: q.answers[index],
    correctAnswer: q.answers[q.correct],
    isCorrect
  });

  $('scoreDisplay').textContent = score;
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIndex === currentQuestions.length - 1 ? 'عرض النتيجة 🏁' : 'السؤال التالي ←';
}

// ==================== التالي ====================
nextBtn.onclick = () => {
  currentIndex++;
  if (currentIndex < currentQuestions.length) loadQuestion();
  else showResult();
};

// ==================== عرض النتيجة ====================
function showResult() {
  clearInterval(timerInterval);
  quizScreen.classList.add('hidden');
  resultScreen.style.display = 'block';

  const maxScore = currentQuestions.length * 15;
  const pct = score / maxScore;

  $('finalScore').textContent = `${score} نقطة`;

  if (pct >= 0.85) { $('trophyEmoji').textContent = '🏆'; $('resultTitle').textContent = 'أسطورة كرة القدم!'; }
  else if (pct >= 0.6) { $('trophyEmoji').textContent = '🥈'; $('resultTitle').textContent = 'خبير كروي!'; }
  else if (pct >= 0.35) { $('trophyEmoji').textContent = '🥉'; $('resultTitle').textContent = 'لاعب واعد!'; }
  else { $('trophyEmoji').textContent = '⚽'; $('resultTitle').textContent = 'مبتدئ طموح!'; }

  if (!bestScores[currentLevel] || score > bestScores[currentLevel]) {
    bestScores[currentLevel] = score;
    localStorage.setItem('bestScores', JSON.stringify(bestScores));
    $('bestScoreMsg').textContent = '🎉 رقم قياسي جديد!';
  } else {
    $('bestScoreMsg').textContent = `🏅 أفضل نتيجة: ${bestScores[currentLevel]} نقطة`;
  }

  const correctCount = userAnswers.filter(a => a.isCorrect).length;
  $('resultMessage').textContent = `أجبت بشكل صحيح على ${correctCount} من ${currentQuestions.length} سؤالاً`;

  const reviewSection = $('reviewSection');
  reviewSection.innerHTML = '<h4>📋 مراجعة الإجابات</h4>';
  userAnswers.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = `review-item ${a.isCorrect ? 'correct' : 'wrong'}`;
    div.innerHTML = `
      <div class="q-text">${i + 1}. ${a.question}</div>
      ${a.isCorrect
        ? `<div class="correct-answer">✓ ${a.correctAnswer}</div>`
        : `<div class="your-answer">✗ إجابتك: ${a.userAnswer}</div>
           <div class="correct-answer">✓ الصحيحة: ${a.correctAnswer}</div>`}
    `;
    reviewSection.appendChild(div);
  });
}

// ==================== إعادة ====================
$('restartBtn').onclick = () => {
  resultScreen.style.display = 'none';
  startScreen.classList.remove('hidden');
  updateBestScoreDisplay();
};

// ==================== مشاركة ====================
$('shareBtn').onclick = () => {
  const levelName = currentLevel === 'easy' ? 'سهل' : currentLevel === 'medium' ? 'متوسط' : 'صعب';
  const text = `⚽ حصلت على ${score} نقطة في تحدي كرة القدم (${levelName})! هل يمكنك التغلب علي؟`;

  if (navigator.share) {
    navigator.share({ title: 'تحدي كرة القدم', text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      alert('✅ تم نسخ النتيجة! شاركها مع أصدقائك');
    }).catch(() => {
      alert(text);
    });
  }
};

// ==================== أفضل نتيجة ====================
function updateBestScoreDisplay() {
  const el = $('startBestScore');
  if (Object.keys(bestScores).length > 0) {
    el.style.display = 'block';
    el.innerHTML = `🏅 أفضل نتائجك:
      سهل: ${bestScores.easy || 0} |
      متوسط: ${bestScores.medium || 0} |
      صعب: ${bestScores.hard || 0}`;
  } else {
    el.style.display = 'none';
  }
}

// ==================== تهيئة ====================
initTheme();
initSound();
updateBestScoreDisplay();

// تسجيل Service Worker تلقائي (يعمل فقط عند استضافة الموقع)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // ملاحظة: يعمل فقط بعد رفع الموقع على استضافة حقيقية
  });
}
</script>
